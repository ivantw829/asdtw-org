<div class="prefs">
  <div class="wrap prefs-bar">
    <details class="prefs-details" data-prefs hidden>
      <summary>Reading settings: text size &amp; theme</summary>
      <div class="prefs-panel">
        <fieldset class="prefs-group">
          <legend>Text size</legend>
          <div class="prefs-buttons">
            <button type="button" data-pref-text="1" aria-pressed="true">Default</button>
            <button type="button" data-pref-text="2" aria-pressed="false">Large</button>
            <button type="button" data-pref-text="3" aria-pressed="false">Extra large</button>
            <button type="button" data-pref-text="4" aria-pressed="false">Largest</button>
          </div>
        </fieldset>
        <fieldset class="prefs-group">
          <legend>Theme</legend>
          <div class="prefs-buttons">
            <button type="button" data-pref-theme="default" aria-pressed="true">Default</button>
            <button type="button" data-pref-theme="dark" aria-pressed="false">Dark</button>
            <button type="button" data-pref-theme="high" aria-pressed="false">High contrast</button>
            <button type="button" data-pref-reset>Reset</button>
          </div>
        </fieldset>
        <p class="visually-hidden" role="status" aria-live="polite" data-prefs-status></p>
      </div>
    </details>
<!--lang-links-->
  </div>
</div>
