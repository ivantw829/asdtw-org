<div class="prefs">
  <div class="wrap prefs-bar">
    <details class="prefs-details" data-prefs hidden>
      <summary>閲覧設定：文字サイズと配色</summary>
      <div class="prefs-panel">
        <fieldset class="prefs-group">
          <legend>文字サイズ</legend>
          <div class="prefs-buttons">
            <button type="button" data-pref-text="1" aria-pressed="true">標準</button>
            <button type="button" data-pref-text="2" aria-pressed="false">大</button>
            <button type="button" data-pref-text="3" aria-pressed="false">特大</button>
            <button type="button" data-pref-text="4" aria-pressed="false">最大</button>
          </div>
        </fieldset>
        <fieldset class="prefs-group">
          <legend>配色</legend>
          <div class="prefs-buttons">
            <button type="button" data-pref-theme="default" aria-pressed="true">標準配色</button>
            <button type="button" data-pref-theme="dark" aria-pressed="false">ダーク</button>
            <button type="button" data-pref-theme="high" aria-pressed="false">ハイコントラスト</button>
            <button type="button" data-pref-reset>初期設定に戻す</button>
          </div>
        </fieldset>
        <p class="visually-hidden" role="status" aria-live="polite" data-prefs-status></p>
      </div>
    </details>
<!--lang-links-->
  </div>
</div>
