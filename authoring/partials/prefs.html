<section class="prefs" aria-label="閱讀設定" data-prefs hidden>
  <div class="wrap">
    <details>
      <summary>閱讀設定：字級與配色</summary>
      <div class="prefs-panel">
        <fieldset class="prefs-group">
          <legend>字級</legend>
          <div class="prefs-buttons">
            <button type="button" data-pref-text="1" aria-pressed="true">標準</button>
            <button type="button" data-pref-text="2" aria-pressed="false">大</button>
            <button type="button" data-pref-text="3" aria-pressed="false">特大</button>
            <button type="button" data-pref-text="4" aria-pressed="false">最大</button>
          </div>
        </fieldset>
        <fieldset class="prefs-group">
          <legend>配色</legend>
          <div class="prefs-buttons">
            <button type="button" data-pref-theme="default" aria-pressed="true">預設配色</button>
            <button type="button" data-pref-theme="dark" aria-pressed="false">深色</button>
            <button type="button" data-pref-theme="high" aria-pressed="false">高對比</button>
            <button type="button" data-pref-reset>還原預設</button>
          </div>
        </fieldset>
        <p class="visually-hidden" role="status" aria-live="polite" data-prefs-status></p>
      </div>
    </details>
  </div>
</section>
