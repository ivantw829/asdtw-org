<!doctype html>
<!--
  文章頁範本（authoring/md2article.py 使用；本註解與所有 {{…}} 會在產生時移除或替換）
  - 閱讀設定、頁首、頁尾不寫在這裡：產生時從 authoring/partials/ 複製（{{PREFS}}／{{HEADER}}／{{FOOTER}}，含 <!--shared:…--> 標記），之後由 build-shared.py 維護。
  - 標題、摘要、日期、分類、作者全部來自 data/articles.json，check.py 會逐字比對。
  - 上一篇／下一篇在 articlenav:start／end 標記之間，由 build-lists.py 靜態寫入（不依賴 JS）。
  - 不得加入 style=、<style>、行內 <script>、外部資源；圖片一律 <figure class="figure"> 並附 <figcaption>。
-->
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}｜福爾摩沙自閉大公社</title>
<meta name="description" content="{{SUMMARY}}">
<meta name="robots" content="{{ROBOTS}}">
<link rel="canonical" href="{{URL}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="福爾摩沙自閉大公社">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="{{TITLE}}｜福爾摩沙自閉大公社">
<meta property="og:description" content="{{SUMMARY}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{OG_ALT}}">
<meta property="article:published_time" content="{{DATE}}">
{{ARTICLE_METAS}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}｜福爾摩沙自閉大公社">
<meta name="twitter:description" content="{{SUMMARY}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">
<meta name="twitter:image:alt" content="{{OG_ALT}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8f6ec">
<link rel="expect" href="#page-end" blocking="render">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="icon" href="/assets/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="alternate" type="application/atom+xml" title="福爾摩沙自閉大公社｜文章" href="/feed.xml">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="/assets/js/prefs.js"></script>
<script type="application/ld+json">
{{LDJSON}}
</script>
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>
{{PREFS}}
{{HEADER}}
<main id="main" tabindex="-1">
  <div class="wrap">
    <article class="article" data-slug="{{SLUG}}">
      <div class="article-head">
        <p class="article-tags">{{TAGS}}</p>
        <h1>{{TITLE}}</h1>
        <p class="lead">{{LEAD}}</p>
        <p class="article-meta">{{META}}</p>
{{ACTION}}
      </div>
{{DRAFT_NOTE}}
      <div class="prose">

{{BODY}}

      </div>
{{SOURCES}}
    </article>
    <nav class="article-nav" aria-label="上一篇與下一篇"><!--articlenav:start--><!--articlenav:end--></nav>
  </div>
</main>
{{FOOTER}}
<span id="page-end" hidden></span>
</body>
</html>
