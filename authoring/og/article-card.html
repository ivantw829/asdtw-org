<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>article og card</title>
<!-- 文章分享圖範本（1200×630）。由 authoring/build-og.py 以無頭 Chrome 截圖；參數：?title=…&category=…
     此檔不在網站頁面內，所以可以用行內樣式與 JS。改這個檔會讓所有文章的分享圖被判定過期並重產。
     配色只用品牌色票：米白 #FFF6EC、炭灰 #3A3A3C、珊瑚紅 #E8695A。 -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #FFF6EC; }
  body {
    box-sizing: border-box; position: relative; padding: 72px 88px 64px 120px;
    display: flex; flex-direction: column; color: #3A3A3C;
    font-family: "Noto Serif TC", "Source Han Serif TC", "Songti TC", serif;
  }
  body::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 32px; background: #E8695A; }
  .eyebrow { display: flex; align-items: center; gap: 20px; font-family: "PingFang TC", "Noto Sans TC", sans-serif;
    font-size: 28px; font-weight: 700; letter-spacing: 0.08em; }
  .pill { padding: 6px 22px; border: 3px solid #E8695A; border-radius: 999px; }
  h1 { margin: 40px 0 0; font-size: 68px; line-height: 1.32; font-weight: 700; letter-spacing: 0.02em;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .foot { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; }
  .foot img { height: 96px; width: 384px; margin-left: -34px; } /* 標誌 SVG 左側自帶留白，對齊標題 */
  .foot span { font-family: "PingFang TC", "Noto Sans TC", sans-serif; font-size: 26px; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="eyebrow"><span class="pill" id="category"></span><span>文章</span></div>
  <h1 id="title"></h1>
  <div class="foot"><img src="../../assets/img/brand/lockup-dark.svg" alt=""><span>asdtw.org</span></div>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById('title').textContent = q.get('title') || '';
  document.getElementById('category').textContent = q.get('category') || '';
  // 標題太長就縮字，最小 46px，仍超過三行才截斷
  var h = document.getElementById('title'), size = 68;
  while (size > 46 && h.scrollHeight > h.clientHeight + 2) { size -= 2; h.style.fontSize = size + 'px'; }
</script>
</body>
</html>
