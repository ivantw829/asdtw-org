<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>og card</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #f8f6ec;
    color: #2b2620;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  .serif { font-family: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif; }
  .text { position: absolute; left: 72px; top: 118px; width: 700px; }
  .eyebrow { font-size: 26px; letter-spacing: .14em; font-weight: 700; color: #6b3f00; margin: 0 0 22px; }
  .name {
    display: inline-block; margin: 0; padding: 14px 30px;
    background: #26281f; color: #f8f6ec;
    font-size: 66px; font-weight: 900; letter-spacing: .12em; line-height: 1.3; white-space: nowrap;
  }
  .tagline { display: flex; align-items: center; gap: 18px; margin: 38px 0 0; font-size: 31px; color: #52493c; line-height: 1.5; }
  .tagline::before { content: ""; flex: none; width: 56px; height: 10px; border-radius: 99px; background: #26281f; }
  .url { position: absolute; left: 72px; bottom: 56px; font-size: 28px; font-weight: 700; letter-spacing: .06em; color: #52493c; }
  .art { position: absolute; right: 56px; top: 56px; width: 360px; height: 518px; }
  .art > * { position: absolute; }
  .c1 { width: 330px; height: 330px; left: 14px; top: 26px; border-radius: 50%; background: #4a7b7f; }
  .c2 { width: 166px; height: 166px; right: 14px; top: 226px; border-radius: 50%; background: #f2c230; box-shadow: 14px 12px 0 #26281f; }
  .out { left: 0; bottom: 18px; font-size: 128px; font-weight: 900; line-height: 1; color: transparent; -webkit-text-stroke: 3px #4a7b7f; letter-spacing: .04em; }
  .xs { right: 0; top: 0; color: #f2c230; font-size: 52px; font-weight: 700; line-height: 1.05; display: flex; flex-direction: column; }
  .bar { left: 0; top: 0; width: 120px; height: 60px; opacity: .75;
    background: repeating-linear-gradient(90deg, #26281f 0 5px, transparent 5px 10px, #26281f 10px 15px, transparent 15px 23px, #26281f 23px 28px, transparent 28px 33px); }
</style>
</head>
<body>
  <div class="text">
    <p class="eyebrow">DISCORD 社群</p>
    <h1 class="name serif">福爾摩沙自閉大公社</h1>
    <p class="tagline serif">身心障礙者與性別少數的社群，也走上街頭</p>
  </div>
  <div class="url">asdtw.org</div>
  <div class="art serif">
    <span class="c1"></span><span class="c2"></span><span class="out">公社</span>
    <span class="xs"><span>×</span><span>×</span><span>×</span></span><span class="bar"></span>
  </div>
</body>
</html>
