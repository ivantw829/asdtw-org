<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>og card</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #f8f6ec;
    color: #2b2620;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  .serif { font-family: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif; }
  .text { position: absolute; left: 72px; top: 118px; width: 700px; }
  .eyebrow { font-size: 26px; letter-spacing: .14em; font-weight: 700; color: #6b3f00; margin: 0 0 22px; }
  .name {
    display: inline-block; margin: 0; padding: 14px 30px;
    background: #26281f; color: #f8f6ec;
    font-size: 56px; font-weight: 900; letter-spacing: .1em; line-height: 1.3; white-space: nowrap;
  }
  .tagline { display: flex; align-items: center; gap: 18px; margin: 38px 0 0; font-size: 29px; color: #52493c; line-height: 1.5; }
  .tagline::before { content: ""; flex: none; width: 56px; height: 10px; border-radius: 99px; background: #26281f; }
  .url { position: absolute; left: 72px; bottom: 56px; font-size: 28px; font-weight: 700; letter-spacing: .06em; color: #52493c; }
  .logo { position: absolute; right: 72px; top: 155px; width: 320px; height: 320px; }
</style>
</head>
<body>
  <div class="text">
    <p class="eyebrow">DISCORD 社群</p>
    <h1 class="name serif">福爾摩沙自閉大公社</h1>
    <p class="tagline serif">身心障礙者與性別少數的社群，也走上街頭</p>
  </div>
  <div class="url">asdtw.org</div>
  <img class="logo" src="../../assets/img/favicon.svg" alt="">
</body>
</html>
